<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Bingo</title>
    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #121026; color: #fff; font-family: sans-serif; overflow-x: hidden; }

        .tab-content { display: none; padding: 15px; padding-bottom: 70px; }
        .tab-content.active { display: block; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #1e1a3a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            border-top: 1px solid #2d2654;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #8b85b1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            width: 20%;
        }

        .nav-btn.active { color: #a855f7; font-weight: bold; }
        .nav-btn i { font-size: 18px; margin-bottom: 3px; }

        /* FULL SCREEN OVERLAY BINGO GAME MODAL */
        #bingoGameScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #121026;
            z-index: 99999; /* ሙሉ በሙሉ ከላይ እንዲሸፍን */
            overflow-y: auto;
            padding: 10px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
        }

        .board-cell {
            background: #2a244d;
            border-radius: 4px;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            color: #aaa;
            cursor: pointer;
        }

        .board-cell.called {
            background: #10b981 !important;
            color: #fff !important;
        }

        .btn-action {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- Tab 1: Home / Game Rooms -->
    <div id="game" class="tab-content active">
        <h2>Bingo Rooms</h2>
        <br>
        <button onclick="openBingoRoom('DBAP1Q6F', 10)" style="width: 100%; padding: 15px; background: #a855f7; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer;">
            JOIN ROOM (10 ETB)
        </button>
    </div>

    <!-- Tab 2: Wallet -->
    <div id="wallet" class="tab-content">
        <h2>Wallet</h2>
        <p>Balance: <span id="userBalance">0.00 ETB</span></p>
    </div>

    <!-- Tab 3: History -->
    <div id="history" class="tab-content">
        <h2>History</h2>
    </div>

    <!-- Tab 4: Scores -->
    <div id="scores" class="tab-content">
        <h2>Leaderboard</h2>
    </div>

    <!-- Tab 5: Profile -->
    <div id="profile" class="tab-content">
        <h2>Profile</h2>
        <p id="userName">User</p>
    </div>

    <!-- FULL SCREEN BINGO MODAL (Screen OVERLAY) -->
    <div id="bingoGameScreen">
        <!-- TOP HEADER -->
        <div style="display:flex; justify-content:space-between; background:#1e1a3a; padding:10px; border-radius:8px; text-align:center; font-size:11px; font-weight:bold;">
            <div>Game ID<br><span id="gameIdDisplay" style="color:#a855f7;">-</span></div>
            <div>Players<br><span id="playersCount">0</span></div>
            <div>Bet<br><span id="stakeDisplay">10</span></div>
            <div>Derash<br><span id="derashDisplay" style="color:#eab308;">0</span></div>
            <div>Called<br><span id="calledCount">0</span></div>
        </div>

        <!-- MAIN LAYOUT -->
        <div style="display:flex; gap:10px; margin-top:10px;">
            <!-- LEFT 75 BOARD -->
            <div style="flex:1.2; background:#1e1a3a; border-radius:10px; padding:6px;">
                <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:4px; text-align:center; font-weight:bold; margin-bottom:5px;">
                    <div style="background:#3b82f6; border-radius:4px;">B</div>
                    <div style="background:#a855f7; border-radius:4px;">I</div>
                    <div style="background:#ec4899; border-radius:4px;">N</div>
                    <div style="background:#22c55e; border-radius:4px;">G</div>
                    <div style="background:#f97316; border-radius:4px;">O</div>
                </div>
                <div id="board75Grid" class="board-grid"></div>
            </div>

            <!-- RIGHT CONTROL PANEL -->
            <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
                <div style="background:#1e1a3a; border-radius:12px; padding:15px; text-align:center;">
                    <div id="currentBallDisplay" style="width:65px; height:65px; border-radius:50%; background:#fff; color:#000; font-size:22px; font-weight:bold; display:flex; align-items:center; justify-content:center; margin:0 auto; border:4px solid #eab308;">
                        --
                    </div>
                </div>

                <div style="background:#1e1a3a; border-radius:12px; padding:12px; text-align:center; flex:1;">
                    <h4 style="margin:0; font-size:14px;">GAME ROOM</h4>
                    <p style="font-size:11px; color:#aaa; margin-top:8px;">ጨዋታው በሂደት ላይ ይገኛል።</p>
                </div>
            </div>
        </div>

        <!-- BOTTOM BUTTONS -->
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-action" onclick="leaveGame()" style="background:#ef4444;">LEAVE</button>
            <button class="btn-action" onclick="refreshGame()" style="background:#3b82f6;">REFRESH</button>
        </div>
    </div>

    <!-- BOTTOM NAV BAR -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('game', this)"><i class="fa-solid fa-gamepad"></i><span>GAME</span></button>
        <button class="nav-btn" onclick="switchTab('scores', this)"><i class="fa-solid fa-trophy"></i><span>SCORES</span></button>
        <button class="nav-btn" onclick="switchTab('history', this)"><i class="fa-solid fa-clock-rotate-left"></i><span>HISTORY</span></button>
        <button class="nav-btn" onclick="switchTab('wallet', this)"><i class="fa-solid fa-briefcase"></i><span>WALLET</span></button>
        <button class="nav-btn" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i><span>PROFILE</span></button>
    </div>

    <script src="app.js"></script>
</body>
</html>
